{{- if .Values.externalSecrets.enabled }}
# aws-credentials Secret is created from env vars by deploy.sh — not managed by Helm.
# AWS secret must be a JSON object with these keys:
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   RABBITMQ_HOST, RABBITMQ_USERNAME, RABBITMQ_PASSWORD
#   API_KEY, DB_ADMIN_PASSWORD

# ── SecretStore ────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStore.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "fintrack-service.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.awsRegion }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key

---
# ── ExternalSecret ─────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fintrack-external-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "fintrack-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ .Values.externalSecrets.target.name }}
    creationPolicy: {{ .Values.externalSecrets.target.creationPolicy }}
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.remoteSecret.key }}
{{- end }}
