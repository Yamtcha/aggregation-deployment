{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fintrack-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "fintrack-service.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fintrack-api
                port:
                  number: {{ .Values.app.service.port }}

          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: fintrack-api
                port:
                  number: {{ .Values.app.service.port }}

          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: fintrack-api
                port:
                  number: {{ .Values.app.service.port }}

          - path: /transaction
            pathType: Prefix
            backend:
              service:
                name: transaction-aggregator
                port:
                  number: {{ .Values.ingress.transactionAggregatorPort }}
{{- end }}
