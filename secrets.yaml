apiVersion: v1
kind: ServiceAccount
metadata:
  name: fintrack-secrets-sa
  namespace: fintrack
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::891377172928:role/fintrack

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: fintrack
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: fintrack-secrets-sa

---
# ExternalSecret: syncs all keys from fintrack/db-credentials into fintrack-secrets.
# The AWS secret must be a JSON object whose keys match the names used by the deployments:
#   db-api-username, db-api-password, db-api-name
#   db-agg-username, db-agg-password, db-agg-name
#   db-admin-password
#   rabbitmq-username, rabbitmq-password
#   jwt-secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fintrack-external-secret
  namespace: fintrack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: fintrack-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: fintrack/db-credentials
