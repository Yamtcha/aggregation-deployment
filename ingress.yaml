apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fintrack-ingress
  namespace: fintrack
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: fintrack.local
      http:
        paths:
          # fintrack-api: auth, sources, ingestion endpoints
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fintrack-api
                port:
                  number: 8080

          # Swagger UI for fintrack-api
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: fintrack-api
                port:
                  number: 8080

          # OpenAPI spec for fintrack-api
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: fintrack-api
                port:
                  number: 8080

          # transaction-aggregator: spending summary queries
          - path: /spending
            pathType: Prefix
            backend:
              service:
                name: transaction-aggregator
                port:
                  number: 8083

          # RabbitMQ management UI (for dev/debug only — remove in production)
          - path: /rabbitmq
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672
